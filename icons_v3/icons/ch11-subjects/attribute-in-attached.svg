<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="128" height="128" role="img" aria-label="Attribute: in, on, or attached"><title>Attribute: in, on, or attached</title><desc>Three diamonds of identical size appear inside the subject square, resting on its top edge, and touching its side. These represent alternative cases, not a requirement that all occur together.</desc><g stroke="#7c3aed" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-8" y="-5" width="13" height="13" rx="1.4" fill="#7c3aed" fill-opacity=".15"/><path class="attribute-diamond" d="M0-2.6L2.6 0 0 2.6-2.6 0Z" transform="translate(-1.5 1.5)" fill="#7c3aed" fill-opacity=".15"/><path class="attribute-diamond" d="M0-2.6L2.6 0 0 2.6-2.6 0Z" transform="translate(-1.5 -7.6)" fill="#7c3aed" fill-opacity=".15"/><path class="attribute-diamond" d="M0-2.6L2.6 0 0 2.6-2.6 0Z" transform="translate(7.6 1.5)" fill="#7c3aed" fill-opacity=".15"/></g></svg>