<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="128" height="128" role="img" aria-labelledby="subject-cause-effective-title subject-cause-effective-desc">
<title id="subject-cause-effective-title">Effective cause / סבה פועלת</title>
<desc id="subject-cause-effective-desc">Chapter 11, Hebrew p229, English p230. The inherited Cause gear directs an arrow toward a separate produced object, using the Result family cube. The object is produced by the cause but is not a continuation of it. The cube is a mnemonic for any effect, including an event or changed understanding, not a restriction to manufactured objects.</desc>
