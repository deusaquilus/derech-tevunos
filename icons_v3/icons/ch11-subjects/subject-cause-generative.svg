<title id="subject-cause-generative-title">Generative cause / סבה מולדת</title>
<desc id="subject-cause-generative-desc">Chapter 11, Hebrew p229, English p230. The inherited Cause gear sends out a continuous stem that branches into a smaller gear of the same family. The repeated form and uninterrupted connection indicate a continuation from its source, as in the tree and its fruit or a father and child. This does not assert identical properties, literal machinery, or permanent physical attachment.</desc>
