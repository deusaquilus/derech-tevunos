<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="128" height="128" fill="none" color="#2563eb" role="img" aria-labelledby="question-of-principle-title question-of-principle-desc"><title id="question-of-principle-title">Two-sided question / אבעיא</title><desc id="question-of-principle-desc">Chapter 9, Hebrew p169, English p170. The Question mark branches into two equal empty option boxes. There are grounds for two sides and the question asks which should be decided. The fork does not mean that every yes/no query is an Ibayya.</desc><g stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M-3-6.6C-3-9.7 3-9.7 3-6.6C3-4.6 0-4.1 0-2.5" stroke-width="1.8" />
