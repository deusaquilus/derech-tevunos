<text x="24" y="32" font-size="16" font-weight="500" fill="#1c1917">Yebamos 112b — Why a deaf-mute may marry and the insane may not</text><text x="24" y="52" font-size="11" fill="#78716c">Derech Tevunos ch. 9, pp. 170-172</text><text x="24" y="70" font-size="11" fill="#78716c">2 sentences · indent shows what answers what · an arrow points at what the move acts on · a faded icon has been dealt with</text>
