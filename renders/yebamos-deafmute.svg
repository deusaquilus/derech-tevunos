<g transform="translate(30 182)" opacity="0.42"><text x="0" y="7" text-anchor="middle" font-size="21" font-weight="700" fill="#2563eb">?</text></g><g transform="translate(64 271)" opacity="1"><rect x="-8.2" y="-8.2" width="16.4" height="16.4" rx="3.6" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/><path d="M -4.3 0.2 L -1.3 3.4 L 4.4 -3.7" fill="none" stroke="#16a34a" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="100" y="170" font-size="11"><tspan fill="#1c1917" font-weight="500">asks for information</tspan><tspan fill="#78716c"> · שאלה · query · The Gemara</tspan></text><text x="100" y="188" font-size="12.5" fill="#1c1917">What is the difference between deaf-mutes, for whom the rabbis ordained that a marriage is valid, and</text><text x="100" y="205" font-size="12.5" fill="#1c1917">the insane, for whom a marriage is invalid?</text><text x="776" y="222" font-size="12" text-anchor="end" fill="#78716c">מאי שנא חרש וחרשת דתקינו להו רבנן נשואין, ומאי שנא דשוטה ושוטה דלא תקינו להו רבנן נשואין?</text><rect x="792" y="174" width="68" height="16" rx="8" fill="#a16207" fill-opacity="0" stroke="#a16207" stroke-width="1"/><text x="826" y="185.5" text-anchor="middle" font-size="10" fill="#a16207">answered</text><text x="776" y="170" font-size="10" text-anchor="end" fill="#78716c">מאי שנא … ומאי שנא</text><text x="100" y="259" font-size="11"><tspan fill="#1c1917" font-weight="500">answers the question</tspan><tspan fill="#78716c"> · תשובה · answer · The Gemara</tspan></text><text x="100" y="277" font-size="12.5" fill="#1c1917">Since deaf-mutes are capable of fulfilling rabbinical ordinances, the rabbis validated their marriage.</text><text x="100" y="294" font-size="12.5" fill="#1c1917">The insane are incapable, so the rabbis did not.</text><text x="776" y="311" font-size="12" text-anchor="end" fill="#78716c">חרש וחרשת דקימא תקנתא דרבנן – תקינו להו רבנן נשואין, שוטה ושוטה דלא קימא תקנתא דרבנן – לא תקינו רבנן נש…</text>
</svg>