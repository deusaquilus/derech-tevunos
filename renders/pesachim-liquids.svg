<text x="168" y="170" font-size="11"><tspan fill="#1c1917" font-weight="500">states a ruling</tspan><tspan fill="#78716c"> · שמועה · first-hand knowledge · R. Eleazar</tspan></text><text x="168" y="188" font-size="12.5" fill="#1c1917">Liquids cannot become unclean at all according to Torah law.</text><text x="776" y="205" font-size="12" text-anchor="end" fill="#78716c">אין טמאה למשקין כל עקר</text><rect x="792" y="174" width="68" height="16" rx="8" fill="#15803d" fill-opacity="0.14" stroke="#15803d" stroke-width="1"/><text x="826" y="185.5" text-anchor="middle" font-size="10" fill="#15803d">accepted</text><text x="168" y="242" font-size="11"><tspan fill="#1c1917" font-weight="500">brings proof</tspan><tspan fill="#78716c"> · הוכחה · demonstration · R. Eleazar</tspan></text><text x="168" y="260" font-size="12.5" fill="#1c1917">Know this, for Yosi ben Yo'ezer of Zeredah testified that the ayil locust is clean and that</text><text x="168" y="277" font-size="12.5" fill="#1c1917">the liquids of the Temple slaughterhouse are clean.</text><text x="776" y="294" font-size="12" text-anchor="end" fill="#78716c">תדע, שהרי העיד יוסי בן יועזר איש צרידה על איל קמצא דכן ועל משקין בית מטבחיא דכן</text><rect x="792" y="246" width="68" height="16" rx="8" fill="#15803d" fill-opacity="0.14" stroke="#15803d" stroke-width="1"/><text x="826" y="257.5" text-anchor="middle" font-size="10" fill="#15803d">stands</text><text x="776" y="242" font-size="10" text-anchor="end" fill="#78716c">תדע, שהרי</text><text x="168" y="331" font-size="11"><tspan fill="#1c1917" font-weight="500">undermines it, but leaves it possible</tspan><tspan fill="#78716c"> · דחיה · opposition · Rav Papa · inferred</tspan></text><text x="168" y="349" font-size="12.5" fill="#1c1917">Even according to the one who holds that liquid uncleanness is Torah law, the liquids of the</text><text x="168" y="366" font-size="12.5" fill="#1c1917">Temple slaughterhouse are a halachah handed down from Sinai.</text><text x="776" y="383" font-size="12" text-anchor="end" fill="#78716c">אפלו למאן דאמר טמאת משקין דאוריתא – משקי בית מטבחיא הלכתא גמירי לה</text><rect x="792" y="335" width="68" height="16" rx="8" fill="#b91c1c" fill-opacity="0" stroke="#b91c1c" stroke-width="1"/><text x="826" y="346.5" text-anchor="middle" font-size="10" fill="#b91c1c">refuted</text><text x="168" y="420" font-size="11"><tspan fill="#1c1917" font-weight="500">refutes it outright</tspan><tspan fill="#78716c"> · סתירה · direct contradiction · Rav Huna b. Rav Nassan</tspan></text><text x="168" y="438" font-size="12.5" fill="#1c1917">But R. Eleazar concluded that liquids have no uncleanness at all precisely from Yosi ben</text><text x="168" y="455" font-size="12.5" fill="#1c1917">Yo'ezer's testimony. If that is a halachah from Sinai, could we derive anything from it?</text><text x="776" y="472" font-size="12" text-anchor="end" fill="#78716c">ואלא הא דאמר רבי אלעזר אין טמאה למשקין כל עקר … ואי הלכתא גמירי לה – מי גמרינן מנה</text>
</svg>