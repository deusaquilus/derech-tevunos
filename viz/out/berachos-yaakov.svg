 it up</tspan></text><g transform="translate(34 122)" opacity="1"><circle cx="0" cy="0" r="8.5" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/><path d="M -3.8 -3.8 L 3.8 3.8 M 3.8 -3.8 L -3.8 3.8" fill="none" stroke="#dc2626" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="126" font-size="10"><tspan fill="#1c1917" font-weight="500">contradiction</tspan><tspan fill="#78716c"> — knocks it down</tspan></text><g transform="translate(241.5 122)" opacity="1"><path d="M 0 -8.6 L 8.2 6.5 C 8.7 7.5, 8.1 8.4, 7.1 8.4 L -7.1 8.4 C -8.1 8.4, -8.7 7.5, -8.2 6.5 Z" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/><path d="M 0 -2.6 V 2.6" fill="none" stroke="#ea580c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="5.7" r="1.15" fill="#ea580c"/></g><text x="256.5" y="126" font-size="10"><tspan fill="#1c1917" font-weight="500">difficulty</tspan><tspan fill="#78716c"> — raises a problem</tspan></text><g transform="translate(449 122)" opacity="1"><path d="M -3.6 3.2 C -7.2 0.2, -7.2 -4.9, -3.5 -7 C -1.2 -8.4, 1.2 -8.4, 3.5 -7 C 7.2 -4.9, 7.2 0.2, 3.6 3.2 Z" fill="#ca8a04" fill-opacity="0.15" stroke="#ca8a04" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M -3.2 5.6 H 3.2 M -2.1 8.1 H 2.1" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="464" y="126" font-size="10"><tspan fill="#1c1917" font-weight="500">resolution</tspan><tspan fill="#78716c"> — clears the problem</tspan></text>
