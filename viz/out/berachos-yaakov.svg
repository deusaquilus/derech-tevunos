<text x="134" y="170" font-size="11"><tspan fill="#1c1917" font-weight="500">states a ruling</tspan><tspan fill="#78716c"> · שמועה · first-hand knowledge · Genesis 28:15</tspan></text><text x="134" y="188" font-size="12.5" fill="#1c1917">Behold I am with you and will protect you wherever you go.</text><text x="776" y="205" font-size="12" text-anchor="end" fill="#78716c">והנה אנכי עמך ושמרתיך בכל אשר־תלך</text><rect x="792" y="174" width="68" height="16" rx="8" fill="#15803d" fill-opacity="0.14" stroke="#15803d" stroke-width="1"/><text x="826" y="185.5" text-anchor="middle" font-size="10" fill="#15803d">accepted</text><text x="134" y="242" font-size="11"><tspan fill="#1c1917" font-weight="500">states a ruling</tspan><tspan fill="#78716c"> · שמועה · first-hand knowledge · Genesis 32:8</tspan></text><text x="134" y="260" font-size="12.5" fill="#1c1917">And Yaakov was very much afraid.</text><text x="776" y="277" font-size="12" text-anchor="end" fill="#78716c">ויירא יעקב מאד</text><text x="134" y="314" font-size="11"><tspan fill="#1c1917" font-weight="500">two sources clash</tspan><tspan fill="#78716c"> · רמיא · apparent contradiction · R. Yaakov bar Idi</tspan></text><text x="134" y="332" font-size="12.5" fill="#1c1917">He raised a contradiction: it is written thus, and it is also written thus.</text><text x="776" y="349" font-size="12" text-anchor="end" fill="#78716c">רבי יעקב בר אידי רמי, כתיב … וכתיב</text><rect x="792" y="318" width="68" height="16" rx="8" fill="#a16207" fill-opacity="0" stroke="#a16207" stroke-width="1"/><text x="826" y="329.5" text-anchor="middle" font-size="10" fill="#a16207">answered</text><text x="776" y="314" font-size="10" text-anchor="end" fill="#78716c">… רמי, כתיב … וכתיב</text><text x="134" y="386" font-size="11"><tspan fill="#1c1917" font-weight="500">resolves it, and means it</tspan><tspan fill="#78716c"> · ישוב · settlement · R. Yaakov bar Idi</tspan></text><text x="134" y="404" font-size="12.5" fill="#1c1917">He said: Yaakov thought that perhaps sin may have some bearing on the promise.</text><text x="776" y="421" font-size="12" text-anchor="end" fill="#78716c">אמר, שמא יגרם החטא</text>
</svg>